buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.77'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}
apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

archivesBaseName = "${mod_name}-forge-${minecraft_version}"

minecraft {
    mappings channel: 'official', version: minecraft_version
    
    if (project.hasProperty('forge_ats_enabled') && project.findProperty('forge_ats_enabled').toBoolean()) {
        // This location is hardcoded in Forge and can not be changed.
        // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
        project.logger.debug('Forge Access Transformers are enabled for this project.')
    }

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            arg "-mixin.config=mimic.mixins.json"
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            arg "-mixin.config=mimic.mixins.json"
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }

    maven {
        url "https://cursemaven.com";
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.19:3.1.14')

    compileOnly fg.deobf('curse.maven:torohealth-245733:3556931')
}

sourceSets.main.java.srcDir '../Common/src/main/java'
sourceSets.main.resources.srcDir '../Common/src/main/resources'

processResources {
    filesMatching('pack.mcmeta') { expand project.properties }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}
test { useJUnitPlatform() }

jar {
    manifest {
        attributes([
                "Specification-Title"     : "mimic",
                "Specification-Vendor"    : ":",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "luke",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "mimic.mixins.json"
        ])
    }
}


jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, "mimic.refmap.json"
}


// GeckoLib 3 bundles Java sources; do not let Javadoc compile dependency sources.
javadoc { options.addStringOption('sourcepath', sourceSets.main.java.srcDirs.join(File.pathSeparator)) }

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}
minecraft.runs {
    gameTestServer {
        // Forge's inherited forceExit kills the Gradle daemon even when every test passes.
        forceExit false
        workingDirectory project.file('run-gametest')
        property 'forge.enabledGameTestNamespaces', 'mimic'
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        arg '-mixin.config=mimic.mixins.json'
        mods {
            mimic {
                source sourceSets.main
                source sourceSets.gametest
            }
        }
    }
}
check.dependsOn gametestClasses

// Keep CI isolated, fast, and deterministic; never run these tests in a player world.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        // Vanilla GameTest supports human-readable SNBT templates directly.
        copy {
            from 'src/gametest/structures'
            into 'run-gametest/gameteststructures'
        }
        def props = file('run-gametest/server.properties')
        props.parentFile.mkdirs()
        if (!props.exists()) {
            props.text = 'level-type=minecraft:flat\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":3}],"biome":"minecraft:plains","structure_overrides":[]}\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\n'
        }
    }
}
